<!doctype html>
<html lang="en" style="background-color: #151716">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Arcelle</title>
    <script>
      /* Paint the launch shell in the user's theme, BEFORE anything renders.
         The bundle's initTheme() does the same resolution (stored prTheme,
         else the Mac's own setting) but only once the module has loaded —
         which is a whole second of dark frame for a light-mode user. Kept
         deliberately tiny and dependency-free; theme.ts stays the source of
         truth for everything after first paint. */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("prTheme");
        } catch (e) {
          /* private mode — fall through to the system setting */
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        var bg = theme === "light" ? "#f4f1e8" : "#151716";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.setProperty("--launch-bg", bg);
        document.documentElement.style.setProperty(
          "--launch-ink",
          theme === "light" ? "#666960" : "#a9ada3",
        );
        document.documentElement.style.setProperty(
          "--launch-dot",
          theme === "light" ? "#c8c6ba" : "#50544f",
        );
      })();
    </script>
    <style>
      /* Launch shell: the window must open into the room's ink, never a blank
         page waiting for the bundle. React's first render replaces #root's
         children, so this vanishes exactly when the real UI is ready. */
      #launch-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        /* The nib's gold, per theme. Literal values because tokens.css has not
           loaded yet; these are --mk-yellow-ink from tokens.css, the contrast-
           safe track — the fill-track yellow is 1.55:1 on ivory paper and the
           nib simply vanished in light mode. Set here rather than in the
           anti-flash script above, which stays untouched. */
        --launch-gold: #baa457;
        background-color: var(--launch-bg, #151716);
        /* The window opens onto the same dotted sheet the app is drawn on,
           so the notebook is there before the bundle is. */
        background-image: radial-gradient(
          circle at 1px 1px,
          var(--launch-dot, #50544f) 1.1px,
          transparent 1.2px
        );
        background-size: 22px 22px;
        color: var(--launch-ink, #a9ada3);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="light"] #launch-shell {
        --launch-gold: #7c6824;
      }
      /* The handwritten wordmark, same construction as <Wordmark/> in
         src/icons/nav.tsx. Kalam is bundled but has not loaded this early, so
         this renders in Bradley Hand — the next face in the --hand stack and a
         macOS system font, so the shell is still handwritten rather than
         falling back to the UI sans for a second. */
      #launch-shell .wm {
        font: 400 26px/1 Kalam, "Bradley Hand", "Noteworthy", "Chalkboard SE",
          cursive;
        letter-spacing: 0.015em;
        padding-top: 3px;
        color: var(--launch-ink, #a9ada3);
        opacity: 0;
        animation: launch-fade 0.6s ease 0.28s forwards;
      }
      #launch-shell svg {
        opacity: 0;
        animation: launch-fade 0.6s ease 0.15s forwards;
      }
      #launch-shell span {
        opacity: 0;
        animation: launch-fade 0.6s ease 0.42s forwards;
      }
      @keyframes launch-fade {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-shell svg,
        #launch-shell .wm,
        #launch-shell span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body style="margin: 0">
    <div id="root">
      <div id="launch-shell" aria-hidden="true">
        <!-- The paper fold-A: a cream ribbon bent into the letter, its
             bottom edge peeling up to show the underside of the fold, a
             four-point spark in the counter. Same 0..100 traced geometry
             as <Logomark/> in src/icons/nav.tsx and public/logo.svg — the
             master artwork lives in assets/brand/appicon.svg. currentColor tracks
             --launch-ink, which
             inverts with the theme; the fold's underside and the spark are
             --launch-gold because the brand plum stays in the app icon and
             never enters the UI. The body is filled even-odd over the flap
             so the flap shows through the counter's bottom lip. -->
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <g transform="scale(0.24)">
            <path d="M57.6 79.1L40 77.6L32.2 76.8L32.2 76.5L33.6 76.1L35.6 75.5L36.6 75.1L36.9 74.8L38.4 74.3L40.5 73.6L42.4 72.9L44.4 72L47.4 71.2L50.9 70.4L52.4 69.9L52.7 69.6L53.8 69.4L55.7 69.4L58 70L60.7 71.1L63.6 72.6L66.5 74.3L69 76.2L71 78L72.1 79.3L70 79.8Z"
                  fill="var(--launch-gold)" fill-opacity="0.6"/>
            <path d="M50.7 17.5L52.2 17.7L53.6 18.2L55.2 19.1L57.4 20.9L60 23.9L62.9 28.7L66.1 34.8L69.2 41.4L72 48.4L74.6 55.4L76.8 62L78.2 66.8L78.7 70.1L78.9 72.4L78.7 73.9L78.3 75.3L77.7 76.7L76.9 77.9L75.8 79.1L74.9 79.8L74.1 80.2L73.6 80.3L73.2 80.2L72.9 79.3L72.5 78.2L71.6 77.7L70.1 77.4L67.7 76L64.5 73.8L61 71.9L57.7 70.4L56.3 69.6L56 69.2L55.2 68.9L53.7 68.5L51.6 68.3L49.2 68.2L47.5 68.4L46.1 68.7L44.2 69.4L41.7 70.4L38.3 72.1L34.5 74.1L31.8 75.3L30.1 75.8L28.7 76L27.6 75.9L26.5 75.7L25.3 75.2L24.4 74.6L23.6 73.8L22.8 72.8L22.2 71.6L21.8 70.3L21.5 69L21.3 67.5L21.4 65.7L21.9 63.1L22.9 59.4L24.8 53.9L27.5 47.3L30.2 41.4L32.8 36.1L35 31.9L37 28.5L39 25.4L41 22.8L42.9 20.8L44.8 19.3L46.9 18.3L49 17.6ZM71.3 77.2L70.5 77L68.9 75.9L66.5 74.2L62.8 72.1L58.6 70.1L56.8 69.1L55.7 68.4L50.8 66.1L43.7 62.9L39.6 60.6L37.8 59L36.8 57.6L36.3 56.2L36.1 54.7L36.1 52.8L36.7 50.1L37.8 46.7L39.5 43.1L41.5 39.5L42.9 37.2L44 36L45.3 34.7L46.8 33.6L48 32.8L49.3 32.4L50.7 32.2L52.2 32.2L53.7 32.7L55 33.5L56.4 34.8L57.8 36.6L59.3 39.3L60.9 43.1L63 48.9L65.6 56.2L68.2 64.3L70.6 71.9L71.7 75.8L71.7 76.8Z"
                  fill="currentColor" fill-rule="evenodd"/>
            <path d="M56.2 48.4Q56.2 50.7 58.5 50.7Q56.2 50.7 56.2 53Q56.2 50.7 53.9 50.7Q56.2 50.7 56.2 48.4Z"
                  fill="var(--launch-gold)"/>
          </g>
        </svg>
        <div class="wm">Arcelle</div>
        <span>Opening your rooms…</span>
      </div>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
