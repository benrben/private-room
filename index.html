<!doctype html>
<html lang="en" style="background-color: #151716">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Arcelle</title>
    <script>
      /* Paint the launch shell in the user's theme, BEFORE anything renders.
         The bundle's initTheme() does the same resolution (stored prTheme,
         else the Mac's own setting) but only once the module has loaded —
         which is a whole second of dark frame for a light-mode user. Kept
         deliberately tiny and dependency-free; theme.ts stays the source of
         truth for everything after first paint. */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("prTheme");
        } catch (e) {
          /* private mode — fall through to the system setting */
        }
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        var bg = theme === "light" ? "#f4f1e8" : "#151716";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.setProperty("--launch-bg", bg);
        document.documentElement.style.setProperty(
          "--launch-ink",
          theme === "light" ? "#666960" : "#a9ada3",
        );
        document.documentElement.style.setProperty(
          "--launch-dot",
          theme === "light" ? "#c8c6ba" : "#50544f",
        );
      })();
    </script>
    <style>
      /* Launch shell: the window must open into the room's ink, never a blank
         page waiting for the bundle. React's first render replaces #root's
         children, so this vanishes exactly when the real UI is ready. */
      #launch-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        /* The nib's gold, per theme. Literal values because tokens.css has not
           loaded yet; these are --mk-yellow-ink from tokens.css, the contrast-
           safe track — the fill-track yellow is 1.55:1 on ivory paper and the
           nib simply vanished in light mode. Set here rather than in the
           anti-flash script above, which stays untouched. */
        --launch-gold: #baa457;
        background-color: var(--launch-bg, #151716);
        /* The window opens onto the same dotted sheet the app is drawn on,
           so the notebook is there before the bundle is. */
        background-image: radial-gradient(
          circle at 1px 1px,
          var(--launch-dot, #50544f) 1.1px,
          transparent 1.2px
        );
        background-size: 22px 22px;
        color: var(--launch-ink, #a9ada3);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="light"] #launch-shell {
        --launch-gold: #7c6824;
      }
      /* The handwritten wordmark, same construction as <Wordmark/> in
         src/icons/nav.tsx. Kalam is bundled but has not loaded this early, so
         this renders in Bradley Hand — the next face in the --hand stack and a
         macOS system font, so the shell is still handwritten rather than
         falling back to the UI sans for a second. */
      #launch-shell .wm {
        font: 400 26px/1 Kalam, "Bradley Hand", "Noteworthy", "Chalkboard SE",
          cursive;
        letter-spacing: 0.015em;
        padding-top: 3px;
        color: var(--launch-ink, #a9ada3);
        opacity: 0;
        animation: launch-fade 0.6s ease 0.28s forwards;
      }
      #launch-shell svg {
        opacity: 0;
        animation: launch-fade 0.6s ease 0.15s forwards;
      }
      #launch-shell span {
        opacity: 0;
        animation: launch-fade 0.6s ease 0.42s forwards;
      }
      @keyframes launch-fade {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-shell svg,
        #launch-shell .wm,
        #launch-shell span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>

  <body style="margin: 0">
    <div id="root">
      <div id="launch-shell" aria-hidden="true">
        <!-- The marker-x-notebook A: a highlighter band with the handwritten
             letter drawn over it, swipe first, then ink. Same 0..100 geometry
             as <Logomark/> in src/icons/nav.tsx, public/logo.svg and the
             application icon (src-tauri/icons/generate.py is the source of
             truth) — the brand is one construction, so all four move together.
             currentColor tracks --launch-ink, which inverts with the theme;
             the band is --launch-gold because the brand lilac stays in the
             app icon and never enters the UI. -->
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <g transform="scale(0.24)">
            <path d="M11 73.5C36 71 66 68.6 90 67L89.2 47.5C65 49.2 35 51.6 10.2 54Z"
                  fill="var(--launch-gold)" fill-opacity="0.42"/>
            <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
               transform="rotate(-1.8 50 50)">
              <path d="M20.5 89C25 66 33 42 44 25.5C48.5 18.8 53 13.4 57.5 10.5" stroke-width="9.4"/>
              <path d="M52.5 14.5C54.5 12.6 56.2 11.2 57.5 10.5" stroke-width="10.6"/>
              <path d="M57.5 10.5C60 26 63.5 55 66.5 88.5" stroke-width="9"/>
              <path d="M40 57.5C49 56.6 58 56.4 66.8 57.2" stroke-width="7"/>
              <path d="M40.6 57.5C40.2 66 40 76 40.2 85.5" stroke-width="7"/>
            </g>
          </g>
        </svg>
        <div class="wm">Arcelle</div>
        <span>Opening your rooms…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
