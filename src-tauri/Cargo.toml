[package]
name = "arcelle"
version = "0.25.0"
description = "Arcelle — an encrypted local AI workspace in a single file"
authors = ["Ben Reich"]
edition = "2021"
# The package now ships two binaries (the Tauri app + the `roomai` CLI), so the
# bundler needs to be told which one is the app.
default-run = "arcelle"

[lib]
name = "arcelle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ADD-20: tiny offline CLI (roomai verify/info/export) built on the lib crate.
# The Tauri desktop app's default binary (src/main.rs) is unaffected.
[[bin]]
name = "roomai"
path = "src/bin/roomai.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# BROWSE-1: the private browser area hosts a CHILD webview inside the main
# window (`Window::add_child` + `WebviewBuilder`), which tauri gates behind
# `unstable`. It is a compile gate on already-shipped API surface, not a
# pre-release fork of the runtime — `cargo check`/`build`/`bundle` are
# unaffected for everything else in the app.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
# Charset-aware decoding of fetched pages (legacy Hebrew sites serve
# windows-1255); already in the tree via reqwest, so this pins nothing new.
encoding_rs = "0.8"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "net", "macros"] }
futures-util = "0.3"
base64 = "0.23"
sha2 = "0.11"
# PRIV-1: fast multi-pattern find/replace for the privacy gatekeeper's
# mechanical door (already in the lock as a transitive dep of regex).
aho-corasick = "1"
# Wave 4a (Idea 2): local-time schedule arithmetic (next daily/weekly run,
# DST-aware). Already in the lock as a transitive dep, so this builds offline.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# ADD-19: recovery-key sidecar crypto (AES-256-GCM + PBKDF2). base64/sha2
# above are reused; these three are the only new crypto deps.
aes-gcm = "0.11"
pbkdf2 = "0.13"
rand = "0.10"
sysinfo = "0.39"
# Owner replacement #1: the host's own event log (`src/obs.rs`). The sidecar's
# stderr was already mirrored to a file; the HOST's decisions — which tools were
# served to which engine, which model a turn picked, whether a Stop was accepted
# — left no trace at all, which is why the flagship agent failure could only be
# diagnosed by believing the model's account of it.
#
# `tracing` was already in the lock (transitively, via tauri/reqwest), so this
# adopts the ecosystem default for a Tokio app rather than inventing a logger.
# tracing-subscriber is taken WITHOUT default features on purpose: `ansi` writes
# colour codes a bug reporter would have to strip out of a file, and `env-filter`
# pulls a regex engine for syntax `filter::Targets` already parses.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
mime_guess = "2"
imagesize = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
umya-spreadsheet = { version = "3.0.0", default-features = false }
# ADD-18: on-device speech-to-text — whisper.cpp compiled into the app (Metal
# on Apple Silicon). The engine is built in; the model downloads on first use,
# same doctrine as Ollama models (never bundled, nothing else to install).
# `metal` must be requested EXPLICITLY: whisper-rs-sys passes GGML_METAL=OFF
# without it (inverting whisper.cpp's Apple default), silently pinning the
# engine to CPU — 26 s model loads and ~6x-realtime decodes on an M-series.
whisper-rs = { version = "0.16", features = ["metal"] }
# ADD-27: neural speaker embeddings — TitaNet-small ONNX run by pure-Rust
# tract (validated bit-exact against onnxruntime; do NOT swap in `ort`, and do
# not assume tract runs other speaker models correctly — it silently
# mis-executed CAM++). The 38 MB model ships as a bundled resource.
tract-onnx = "0.23.4"

# Legacy Office formats, read natively instead of through an optional CLI.
# `.doc`, `.ppt` and `.xls` used to be readable ONLY if the user happened to
# have installed Microsoft's MarkItDown themselves (`pipx install markitdown`),
# which for a shipped Mac app meant "not readable" — GUI apps don't inherit a
# login shell's PATH, so even an installed copy is often invisible.
#
# calamine reads .xls (and .ods) in pure Rust; cfb reads the OLE Compound File
# container that .doc and .ppt are stored in, which is enough to recover their
# text. Both are pure Rust with no native libraries to bundle, sign or notarize
# — deliberately chosen over Extractous (Apache Tika via GraalVM) and
# office_oxide (0.1.x) for exactly that reason.
calamine = "0.36"
cfb = "0.14"
chardetng = "1.0.0"

# A saved web page has to be the ARTICLE, not the page: nav, share rails,
# related-story promos and cookie bars stripped, headings/lists/images/links
# kept. That is the Readability problem, and it is not a tag blacklist — it is
# Mozilla's node-scoring algorithm, which is why `extraction::strip_html`'s
# "keep <main>, drop <nav>" heuristic only works on pages that used semantic
# tags in the first place.
#
# dom_smoothie is a maintained, pure-Rust port of that algorithm (metadata
# included: og:/article:/JSON-LD), and it is built on dom_query — which this
# app ALREADY compiles, because both wry and tauri-utils depend on it. So the
# alternatives were: `readability` 0.3 (last released 2021, drags in its own
# reqwest), `article_scraper` (libxml2 — a native library to bundle, sign and
# notarize, the exact cost calamine/cfb were chosen to avoid), or writing the
# scorer ourselves. `serde` is off: the metadata crosses our own boundary as
# `extraction::PageMeta`, not as this crate's types.
dom_smoothie = { version = "0.18", default-features = false }
# Used directly to walk the extracted article into Markdown (the searchable
# copy). Its own `md()` serializer escapes `.`, `"`, `(` and `#` in running
# prose — correct CommonMark, unreadable as text, and that text is what search
# indexes and the model reads.
dom_query = "0.28"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

# macOS-only native deps: ADD-14 OCR (Apple Vision) + ADD-11 Touch ID (Keychain)
# + ADD-27 system-audio capture (ScreenCaptureKit) for recording meetings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    # `AVAsset::duration` returns a CMTime, and objc2-av-foundation's binding
    # for it only exists when this crate exposes the type — enabling the
    # optional dep is not enough, the module itself is feature-gated here.
    "CMTime",
    # The continuity capture anchors to the VIDEO TRACK's own time range, not
    # the asset duration — an audio track that runs 76 ms past the video (AAC
    # priming padding, empirically reproduced) makes a zero-tolerance request
    # at "duration − 1/30" land AFTER the last video frame and fail outright.
    "CMTimeRange",
] }
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "SCShareableContent",
    "block2",
    "dispatch2",
    "objc2-core-media",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
] }
# ADD-25: webview snapshots. block2 carries the ObjC completion-handler block;
# objc2-web-kit exposes WKWebView.takeSnapshotWithConfiguration:; objc2-app-kit
# does the NSImage → NSBitmapImageRep → PNG conversion.
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKSnapshotConfiguration",
    "WKWebView",
    "block2",
    # BROWSE-1: the private browser area builds its own WKWebViewConfiguration
    # before the child webview exists — a NON-PERSISTENT website data store (no
    # history/cookies/cache ever touches the disk), the agent's page script as a
    # document-start WKUserScript on every frame, and a compiled
    # WKContentRuleList (trackers + the private-network block that mirrors
    # web::guard for sub-resources, which on_navigation cannot see).
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKUserContentController",
    "WKUserScript",
    "WKContentRuleList",
    "WKContentRuleListStore",
] }
# QuickLook: the OS's own preview generator. One integration turns
# "No preview available for this file type yet" into a real page for the
# formats nothing in this app can parse — .key/.pages/.numbers, legacy
# .doc/.ppt, RAW photos, PSD, 3D models. Thumbnailing (not QuickLookUI) is the
# right half: it renders to an image the webview can show, rather than to an
# AppKit panel that cannot live inside a Tauri window.
objc2-quick-look-thumbnailing = { version = "0.3", features = [
    "QLThumbnailGenerator",
    "QLThumbnailGenerationRequest",
    "QLThumbnailRepresentation",
    "block2",
] }
# Video technical metadata (duration/resolution/codec/fps/audio track). Already
# in the lock as a transitive dep of objc2-screen-capture-kit and objc2-vision,
# so promoting it to a direct dependency downloads nothing. `default-features =
# false` is LOAD-BEARING: the default set pulls objc2-media-toolbox and
# objc2-avf-audio (neither is in the lock, and avf-audio is the crate the
# neural-voice work deliberately deleted) and compiles ~200 unused modules.
# The two `objc2-*` feature names below are this crate's OPTIONAL-DEPENDENCY
# features, not our own deps: without them `AVAsset::duration` (needs CMTime)
# and `AVAssetTrack::naturalSize` (needs CGSize) do not exist at all.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVAsset",
    "AVAssetTrack",
    # The Story tab's continuous mode: capture the REAL final frame of a
    # finished clip so the next clip starts on exactly that picture. The
    # alternative was trusting the model to land on its `last_frame` target,
    # which they treat as guidance — the reported "scene 2 does not start
    # where scene 1 ended".
    "AVAssetImageGenerator",
    "AVMediaFormat",
    "objc2-core-media",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-vision = { version = "0.3", features = [
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    "VNObservation",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFData",
    "CFCGTypes",
    # Idea 3: speech synthesis pumps the main run loop when called headless
    # (tests) — AVSpeech's buffer callback rides the main queue.
    "CFRunLoop",
    "CFDate",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGColorSpace",
    "CGContext",
    "CGBitmapContext",
    "CGDataProvider",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Release settings for the binary users actually install.
#
# `strip`: without it the shipped binary carries every debug symbol and thousands
# of absolute build-machine paths (/Users/<name>/… and the whole source-tree
# layout, plus every dependency's checkout path). For an app whose promise is
# privacy that is an avoidable leak, and it roughly doubles the download.
# The handful of paths that survive stripping — `file!()` baked into panic
# messages — are rewritten by the --remap-path-prefix flags scripts/release.sh
# exports. (Cargo's own `trim-paths` would do that here, but it is still
# unstable as of cargo 1.95.)
[profile.release]
strip = "symbols"

# Arithmetic overflow panics instead of wrapping, matching the `test` profile —
# otherwise a number bug behaves one way in the 688-test suite and another way
# for users. Scoped to our own crates: the release profile applies to every
# dependency too, and the checks sit in the inner loops of tract-onnx (speaker
# embeddings run over hours of audio) and the image decoders.
[profile.release.package.arcelle]
overflow-checks = true

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# ADD-27: mock-app harness for the live-recording engine integration test.
tauri = { version = "2", features = ["test"] }
# Scratch directories for tests that write real files (the recents list, the
# recovery sidecar) — test-only, so it never ships in the app.
tempfile = "3"

