    <!-- the gold spark in the counter -->
    <path fill="#e0c180"
          d="M56.2 48.4Q56.2 50.7 58.5 50.7Q56.2 50.7 56.2 53Q56.2 50.7 53.9 50.7Q56.2 50.7 56.2 48.4Z"/>
  </g>
</svg>
